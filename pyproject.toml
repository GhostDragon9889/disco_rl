[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disco_rl"
version = "1.0.0"
description = "DiscoRL: Discovering State-of-the-art Reinforcement Learning Algorithms."
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [{name = "DiscoRL team", email="disco_rl@google.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]
keywords = [
  "reinforcement learning",
  "rl",
  "meta learning",
  "meta",
  "update rule",
  "automated discovery",
  "automl",
  "algorithm discovery",
  "data driven research",
]

# pip dependencies of the project
# Installed locally with `pip install -e .`
dependencies = [
  "jax>=0.6.0,<0.7",
  "jaxlib>=0.6.0,<0.7",
  "chex>=0.1.90,<0.1.91",
  "distrax>=0.1.5,<0.1.7",
  "tensorflow-probability>=0.25.0,<0.26",
  "optax>=0.2.5",
  "jmp>=0.0.4",
  "rlax>=0.1.7,<0.1.8",
  "dm-haiku>=0.0.14",
  "numpy>=2.0",
  "immutabledict",
  "ml_collections",
  "matplotlib",
  "seaborn",
  "pandas",
  "tqdm"
]

[project.optional-dependencies]
# Install with `pip install -e .[cuda12]` on machines with NVIDIA GPUs.
# The base dependency set intentionally remains CPU-safe; this extra installs
# JAX's CUDA plugin to avoid the "CUDA-enabled jaxlib is not installed" warning.
cuda12 = [
  "jax[cuda12]>=0.6.0,<0.7",
]

[project.urls]
repository = "https://github.com/google-deepmind/disco_rl"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["*"]  # package names should match these glob patterns (["*"] by default)
